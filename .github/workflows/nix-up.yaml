name: Nix Up CI/CD
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: |
          cat > user-config.nix << 'EOF'
          {
            username = "ci-user";
            uid = 1000;
            hostname = "perseus";
            isLaptop = false;
            hasGPU = false;
            thunderbolt = false;
            timezone = "Europe/Amsterdam";
            latitude = 52.4;
            longitude = 4.9;
            browsers = ["firefox"];
            devTools = ["python" "go"];
            email = true;
            vpn = false;
            gitName = "CI User";
            gitEmail = "ci@example.com";
            wallpaperPath = "assets/wallpaper.png";
            avatarPath = "assets/king.png";
          }
          EOF
      - run: nix flake show
      - run: nix run nixpkgs#statix -- check .
      - run: nix run nixpkgs#deadnix -- .
      - run: nix eval .#nixosConfigurations.perseus.config.system.build.toplevel
